[package]
name = "moso-authz"
description = "Moso's authorization battery: typed permissions, roles, scoped role assignments, resource policies, query-level filtering and an explainable audit trail."
categories = ["authentication", "web-programming"]
keywords = ["moso", "authorization", "rbac", "permissions", "policy"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# `Error`, `Guard`, `Dependency`, `RequestCtx` — `#[requires]` expands to a
# `Guard` and `Authorized<..>` is an `Extract`.
moso-core.workspace = true
# `Id<E>` names a resource in an audit record; the DTOs are `Schema` types.
moso-schema.workspace = true
# The 403 and the `security` requirement a permission implies.
moso-openapi.workspace = true
# `ScopedPolicy` transforms a `Select<R>`, and a policy loads the resource it
# is asked about (`xtask/allow/dep-edges.toml`: authz -> orm).
moso-orm.workspace = true

chrono.workspace = true
futures-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The batching audit sink's flusher and the retention purge are spawned tasks on
# a timer, and `AuditGuard::drop` blocks on the last batch. Declared here rather
# than inherited through `moso-orm`, so the features this crate uses are the
# features it asks for.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
serde_json.workspace = true
# `Entity` needs `TableRef`/`ValueKind` to declare a table in the test fixture.
moso-sql.workspace = true
# `AppState::for_tests()` — a `RequestCtx` for the unit tests of `actor_layer`,
# which needs a context before the router has built one. `test` is a
# dev-dependency feature only: a production-reachable one is an
# authentication-bypass primitive.
moso-core = { workspace = true, features = ["test"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
