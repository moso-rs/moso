[package]
name = "moso-authz-tests"
description = "The end-to-end corpus for Moso's authorization macros: a real registry, compiled through the facade and run."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]

# `moso` with the `authz` feature on, which is the *only* configuration in which
# `permissions!`, `roles!`, `#[requires]` and `#[public]` can compile: every path
# they emit resolves against `::moso::__private::*` (decision D6), and that half
# of `__private` only exists behind `authz`. Turning the feature on here rather
# than in `moso` itself is what keeps `xtask check-deps` rule 6 measuring a
# facade whose default features pull no database driver.
[dev-dependencies]
moso = { workspace = true, features = ["authz"] }
# The runtime types the generated code implements. Named directly because the
# facade re-exports them only under `__private`, which an application must not
# import; a test that reads the *result* of the macros is exactly the place to
# name the real crate.
moso-authz.workspace = true
moso-core.workspace = true
moso-openapi.workspace = true
moso-schema.workspace = true
# `moso_authz::testing` compares a `ScopedPolicy`'s `WHERE` clause against its
# `Policy` through a real database, so the corpus declares an `Entity` and seeds
# a table — which needs the ORM and the identifiers `Entity` names.
moso-orm.workspace = true
moso-sql.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Driving the composed application through one request, which is the only way
# to prove a layer, a guard and the audit trail agree about who was refused.
tower.workspace = true
