[package]
name = "moso-mail"
description = "Moso's mail battery: a framework-owned Mailer trait, compile-time-checked templates, a browsable dev preview inbox, a suppression list and verified provider webhooks."
categories = ["email", "web-programming"]
keywords = ["moso", "mail", "email", "smtp", "transactional"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The backend table of `docs/03-batteries/34-mail-storage-realtime.md`.
# `console` and `memory` are on by default: neither needs a service, and
# between them they cover `moso dev` and every test.
default = ["console", "memory"]
console = []
file = []
memory = []
mail-smtp = ["dep:lettre"]
mail-ses = ["provider"]
mail-sendgrid = ["provider"]
mail-postmark = ["provider"]
mail-resend = ["provider"]
mail-mailgun = ["provider"]
# Private: the shared REST machinery behind the five provider backends. Turning
# it on alone does nothing — `MailProvider` has no variants without one of the
# five above.
provider = ["dep:reqwest", "dep:rustls"]

[dependencies]
# `Error`, `Router` (the `/_mail` preview inbox) and `SecretString` (an API key).
moso-core.workspace = true
# `Email` the *address* type, `Url`, and `Schema` for the webhook payloads.
moso-schema.workspace = true
# The preview inbox routes describe themselves.
moso-openapi.workspace = true
# No battery edge: a service must be able to send mail without an ORM
# (`xtask/allow/dep-edges.toml`: mail -> []). `RenderedEmail` is the
# `Serialize` seam a `moso-jobs` payload carries, which is why sending from a
# job needs no dependency in either direction.

# `Router::mount_axum` is how a route captures state it was handed at boot —
# the preview inbox and the development serve route both need one. Already
# compiled for every Moso application through `moso-core`.
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs"] }
tracing.workspace = true

# The Jinja2-compatible engine `34-mail-storage-realtime.md` names. Its
# `undeclared_variables` is the runtime half of the derive's compile-time check.
minijinja.workspace = true
# MIME `Content-Transfer-Encoding`, and a `RenderedEmail` attachment surviving
# JSON on its way through a job payload.
base64.workspace = true
# Webhook signature verification. Already in the graph through sqlx's rustls
# provider, so it costs nothing: HMAC-SHA256 for Mailgun and Resend, ECDSA-P256
# for SendGrid, RSA-PKCS1-SHA256 for SES/SNS, and `constant_time` for the
# shared-secret compare Postmark uses.
ring.workspace = true

# ── backends ────────────────────────────────────────────────────────────────
lettre = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, optional = true }

[dev-dependencies]
# `net` is test-only: the deadline tests stand a silent loopback listener up in
# place of a provider that accepts a connection and then stops answering.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
serde_json.workspace = true
futures-util.workspace = true
# The acceptance tests drive the `/_mail` routes through the router they are
# mounted in, rather than calling the handlers directly.
axum.workspace = true
tower.workspace = true
http.workspace = true
bytes.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
