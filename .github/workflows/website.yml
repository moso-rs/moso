name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Allow one deployment at a time, and let a newer commit supersede an
# in-flight one rather than queueing behind it.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # House style and content invariants: no em dashes, frontmatter present,
      # every internal link resolves, every code fence has a language.
      - name: Lint content
        run: pnpm run lint:content

      - name: Type check
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      # Prerendering is configured to fail on a broken internal link or a
      # missing heading anchor, so this step is also the link checker.
      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: ${{ github.event_name == 'push' && '/moso' || '' }}

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
