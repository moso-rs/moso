[package]
name = "example-crud"
description = "The Moso tutorial application: posts CRUD over Moso's ORM (SQLite) with a battery-backed API-key guard."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# NOTE: examples deliberately do NOT inherit [workspace.lints]. They are sample
# applications and must look exactly like code a user would write.

# `orm` brings in `moso::db` (entities, queries, SQLite) and `auth` brings in
# `moso::auth` (the API-key authenticator). Both are OFF by default on the
# facade — a stateless service compiles no database driver — so an application
# that wants them asks, exactly as here.
[dependencies]
chrono.workspace = true
moso = { workspace = true, features = ["orm", "auth"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# No `[dev-dependencies]`. The integration tests drive the application through
# `App::into_service()` and `tower`'s `oneshot`, both of which arrive through
# `moso::deps`, so the whole harness is `tests/support/mod.rs` — the example is
# deliberately self-contained and shows how to drive a Moso app with nothing but
# the facade. `moso_test::test_app!` is the batteries-included alternative a real
# project reaches for; `examples/minimal` and the crate's own tests use it.
