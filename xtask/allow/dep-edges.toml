# Declared dependency edges between battery crates — read by `xtask check-deps`.
#
# Dependency rule 5 in `docs/00-foundations/03-crate-layout.md` says "batteries
# MUST NOT depend on each other except along declared edges" and then does not
# declare them, because when it was written no battery existed. This file is that
# declaration. Adding an edge here is an architecture decision: it decides what
# a user who wants jobs but not an ORM has to compile.
#
# Edges to the non-battery crates (`moso-core`, `moso-schema`, `moso-openapi`,
# `moso-macros`) are unrestricted and are not listed — rule 5 is about
# battery-to-battery coupling only. Edges *out* of a battery to a crate not
# listed for it fail the gate.

[batteries]
# The crates rule 5 governs. A battery not in this list is not checked, so a new
# one must be added here as well as to the workspace.
members = [
  "moso-sql",
  "moso-orm",
  "moso-orm-macros",
  "moso-migrate",
  "moso-kv",
  "moso-auth",
  "moso-authz",
  "moso-jobs",
  "moso-mail",
  "moso-storage",
  "moso-admin",
]

[edges]
# `crate = [dependencies it may have]`, plus a reason for each in the comment
# above it. An empty list means "must not depend on any other battery".

# The sealed facade is the bottom of the data layer; it depends on nothing above
# it, which is what lets ADR-0005 replace the engine underneath it.
"moso-sql" = []

# Construction goes through the sealed facade (ADR-0005); execution is sqlx,
# which is not a battery.
"moso-orm" = ["moso-sql"]

# A proc-macro crate depends on no runtime crate at all (rule 1 covers this too);
# it is listed so that rule 5 does not have to special-case it.
"moso-orm-macros" = []

# Migrations are generated by diffing the entity descriptors the ORM derives
# (non-negotiable N6), and rendered through the sealed facade.
"moso-migrate" = ["moso-orm", "moso-sql"]

# The cache layer is deliberately independent of the database: `docs/02-data/25`
# specifies a memory, a redis and a postgres backend, and the postgres one talks
# to sqlx directly rather than through the ORM, so that a stateless service can
# have a cache without an ORM.
"moso-kv" = []

# Users live in a table (`AuthUser` is an entity) and sessions live in a KV
# store (`docs/03-batteries/30-auth.md`).
"moso-auth" = ["moso-orm", "moso-kv"]

# Policies load the subject's roles and the resource being checked, both of
# which are entities (`docs/03-batteries/31-authorization.md`).
"moso-authz" = ["moso-orm"]

# The default queue is a Postgres table with `SKIP LOCKED`, and the scheduler's
# leader election is a KV compare-and-swap (`docs/03-batteries/32-jobs.md`).
"moso-jobs" = ["moso-orm", "moso-kv"]

# A `Mailer` sends; it does not queue. Enqueuing a mail job is the application's
# composition, so that a service can send mail without an ORM
# (`docs/03-batteries/34-mail-storage-realtime.md`).
"moso-mail" = []

# A `Storage` puts bytes somewhere. Same argument as mail.
"moso-storage" = []

# The admin is generated from entity descriptors, guards every action through a
# policy, and needs a logged-in operator (`docs/03-batteries/33-admin.md`).
"moso-admin" = ["moso-orm", "moso-authz", "moso-auth"]
